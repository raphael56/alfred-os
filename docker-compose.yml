version: '3.8'

services:
  # --- DATABASE ---
  db:
    image: ankane/pgvector:v0.5.1
    container_name: alfred-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: alfred
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alfredsupersecret}
      POSTGRES_DB: alfred_core
    volumes:
      - ./persistence/pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - alfred-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfred"]
      interval: 5s
      retries: 5

  # --- BACKEND (RUST) ---
  backend:
    build: ./backend
    container_name: alfred-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://alfred:${DB_PASSWORD:-alfredsupersecret}@db:5432/alfred_core
      RUST_LOG: info
      SERVER_PORT: "8080"
      ALFRED_API_TOKEN: ${ALFRED_API_TOKEN:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./data/garmin:/data/garmin:ro
    ports:
      - "8080:8080"
    networks:
      - alfred-net

  # --- FRONTEND (NEXT.JS) ---
  frontend:
    build: ./frontend
    container_name: alfred-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_INTERNAL_URL: http://backend:8080
      # Alfred Bun API (running on host, port 3003)
      ALFRED_API_INTERNAL_URL: http://host.docker.internal:3003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3002:3000"
    networks:
      - alfred-net

  # --- GARMIN SYNC (PYTHON SIDECAR) ---
  garmin-sync:
    build: ./garmin-sync
    container_name: alfred-garmin-sync
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      GARMIN_EMAIL: ${GARMIN_EMAIL:-}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD:-}
      BACKEND_URL: http://backend:8080
      SYNC_INTERVAL: "30"
    networks:
      - alfred-net

networks:
  alfred-net:
    driver: bridge
